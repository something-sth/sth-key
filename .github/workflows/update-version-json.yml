name: Update update/version.json

# ============================================================
# 为什么用「tag push」而不是「release published」
# ============================================================
# 最初写的是 `on: release: types: [published]`。但 v2.8.8 实测：
# 发布 Release 时 GitHub 会同时创建 tag，而如果那次提交/推送与发布几乎同时，
# release 事件拿到的默认分支快照里可能还没有这个工作流文件 —— 结果**一次都没触发**。
#
# tag push 是更可靠的锚点：网页上「Publish release」一定会创建 tag，
# 只要 tag 推上来时工作流文件已在 master 上，就必然触发。
#
# 另外保留 `workflow_dispatch`：用来手动补跑（比如上次没触发，想回填 downloadUrl / release 正文）。
#
# ⚠️ versionCode 规则与 app/build.gradle.kts 一致：major*100 + minor*10 + patch
#    （2.8.7 → 287，2.8.8 → 288）。改规则时两处要一起改。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要写入的 tag（留空 = 仓库里最新的 tag）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="$(git describe --tags --abbrev=0)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "本次写入 tag: $TAG"

      - name: Fetch release metadata
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # 用 REST API（curl）而不是 `gh release view --json`：
          # gh 的 --json 输出是 camelCase，字段名容易踩坑；REST 的 snake_case 是稳定契约。
          # 带 token 的请求限额 5000 次/小时，远超需要。
          #
          # Release 可能比 tag 晚几秒创建，重试几次；实在没有也不失败（先写版本号，之后可手动补跑）
          for i in 1 2 3 4 5; do
            if curl -sf --retry 2 --max-time 20 \
                 -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/vnd.github+json" \
                 -H "User-Agent: sth-key-release-sync" \
                 "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
                 -o release.json; then
              echo "found=true" >> "$GITHUB_OUTPUT"
              echo "Release $TAG 已找到"
              exit 0
            fi
            echo "Release $TAG 还没出现，${i}/5 次，等 10s..."
            sleep 10
          done
          echo '{}' > release.json
          echo "found=false" >> "$GITHUB_OUTPUT"
          echo "Release $TAG 始终没找到，只写版本号"

      - name: Write update/version.json
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          FOUND: ${{ steps.rel.outputs.found }}
        run: |
          python3 <<'PY'
          import datetime
          import json
          import os
          import re

          tag = os.environ["TAG"].strip()
          found = os.environ.get("FOUND") == "true"

          match = re.search(r"(\d+)\.(\d+)\.(\d+)", tag)
          if not match:
              raise SystemExit(f"tag 里没有版本号: {tag}")
          major, minor, patch = (int(x) for x in match.groups())
          version_code = major * 100 + minor * 10 + patch
          version_name = f"{major}.{minor}.{patch}"

          release = {}
          if found:
              with open("release.json", encoding="utf-8") as f:
                  release = json.load(f)

          download_url = ""
          for asset in release.get("assets") or []:
              if asset.get("name", "").lower().endswith(".apk"):
                  # REST API 字段：browser_download_url（snake_case）
                  download_url = asset.get("browser_download_url") or ""
                  break

          page_url = (
              release.get("html_url")
              or f"https://github.com/{os.environ.get('GITHUB_REPOSITORY')}/releases/tag/{tag}"
          )

          data = {
              "versionCode": version_code,
              "versionName": version_name,
              "tag": tag,
              "pageUrl": page_url,
              "downloadUrl": download_url,
              "notes": (release.get("body") or "").strip(),
              # 每次运行都会变 → 便于从提交里确认"这次到底跑没跑/取到了什么"
              "generatedAt": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }

          os.makedirs("update", exist_ok=True)
          with open("update/version.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY

      - name: Commit
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update/version.json
          if git diff --cached --quiet; then
            echo "version.json 没变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(update): 同步 version.json 到 $TAG"
          git pull --rebase origin master
          git push origin HEAD:master
