# ============================================================
# Gradle 守护进程用哪个 JDK
# ============================================================
# 这个文件由 `gradlew updateDaemonJvm` 生成（Gradle 的 "daemon JVM criteria"）。
#
# ⚠️ 原来这里钉的是 21，导致本机构建直接失败：
#     Unable to download toolchain matching the requirements
#     ({languageVersion=21 ...})
#   因为本机只装了 JDK 25，而这个文件要求一律用 JDK 21 启动守护进程，
#   离线时没法去 foojay 下载，于是**任何** gradle 命令都跑不起来。
#
# 之所以以前没炸：那时一直复用一个早就启动好的守护进程，
# 它是在这个文件生效之前起来的。守护进程一重建就暴露了。
#
# 现在改成**本机实际安装的版本**。判断依据：项目不需要特定 JDK ——
# AGP 与 Kotlin 都只要求"能编译到 Java 11 字节码"，而这个由
# `compileOptions` 指定，与守护进程用哪个 JDK 无关。
#
# ============================================================
# 换机器 / 升级 JDK 时怎么办
# ============================================================
# 改下面这一行即可（或删掉整个文件，让 Gradle 用 JAVA_HOME）。
# `toolchainVersion` 必须与 `JAVA_HOME` 指向的 JDK 大版本一致。
#
# ⚠️ **不要把这一行改成别人机器上没有的版本**：它是"启动 Gradle 自己"用的，
#    对不上就是所有 gradle 命令一起失败，而且报错指向的是一个下载地址，
#    很容易被误解成网络问题。
toolchainVersion=25
